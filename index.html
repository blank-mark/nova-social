<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Prospect Chat</title>
  <style>
    :root {
      --bg: #f4f4f4;
      --panel: #ffffff;
      --text: #111111;
      --muted: #666666;
      --line: #d9d9d9;
      --accent: #2f6fed;
      --accent2: #2458bd;
      --danger: #b42318;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 18px;
    }

    header .me {
      color: var(--muted);
      font-size: 14px;
    }

    header button,
    .btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    header button:hover,
    .btn:hover { border-color: #b8b8b8; }

    header .danger {
      border-color: #f1b8b3;
      color: var(--danger);
    }

    main {
      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: 0;
    }

    aside, section {
      min-height: 0;
      overflow: auto;
    }

    aside {
      border-right: 1px solid var(--line);
      background: #fafafa;
      padding: 16px;
    }

    section {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      background: var(--panel);
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .card h2, .card h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      margin: 10px 0 6px;
      color: var(--muted);
    }

    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    textarea {
      resize: none;
      min-height: 46px;
      max-height: 120px;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .row > * { flex: 1; }
    .row .btn { flex: 0 0 auto; }

    .muted { color: var(--muted); font-size: 13px; }
    .hidden { display: none !important; }

    .chat-list {
      display: grid;
      gap: 10px;
    }

    .chat-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 12px;
      cursor: pointer;
    }

    .chat-item.active {
      border-color: var(--accent);
      background: #f7faff;
    }

    .chat-item .top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-bottom: 4px;
    }

    .chat-item .name {
      font-weight: 700;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-item .time {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .chat-item .preview {
      font-size: 13px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-top {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .chat-top h2 {
      margin: 0;
      font-size: 16px;
    }

    .messages {
      padding: 16px 18px;
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .msg {
      max-width: min(680px, 100%);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
      background: #fff;
    }

    .msg.me {
      margin-left: auto;
      background: #f4f8ff;
      border-color: #c8d8ff;
    }

    .msg .meta {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .msg .text {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
      line-height: 1.35;
    }

    .composer {
      border-top: 1px solid var(--line);
      padding: 14px 18px;
      display: grid;
      gap: 10px;
    }

    .composer .send-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .composer .send-row textarea {
      flex: 1;
    }

    .chat-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .chat-actions .btn {
      padding: 8px 10px;
      font-size: 12px;
    }

    .icon-btn {
      width: 42px;
      padding: 10px 0;
      font-size: 16px;
      flex: 0 0 auto;
    }

    .image-row {
      margin-top: 0;
    }

    .image-row input {
      width: 100%;
    }

    .msg {
      position: relative;
    }

    .msg.selected {
      outline: 2px solid var(--accent);
    }

    .msg-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .msg-btn {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      font-size: 12px;
      padding: 4px 8px;
      cursor: pointer;
      color: var(--text);
    }

    .msg-image {
      display: block;
      max-width: 100%;
      border-radius: 12px;
      margin-top: 8px;
      border: 1px solid var(--line);
    }

    .msg.deleted .text {
      font-style: italic;
      color: var(--muted);
    }

    .msg.deleted .msg-image {
      opacity: 0.35;
      filter: grayscale(1);
    }

    .primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .primary:hover { background: var(--accent2); }

    .auth-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .status {
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #f1f5ff;
      border: 1px solid #d6e0ff;
      color: #234;
      margin-bottom: 12px;
    }

    .error {
      background: #fff5f5;
      border-color: #ffd0cf;
      color: var(--danger);
    }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Nova Prospect Chat</h1>
        <div class="me" id="headerMe">Не вошёл</div>
      </div>
      <div class="row" style="gap:10px; flex:0 0 auto;">
        <button id="refreshBtn" title="Обновить список">Обновить</button>
        <button id="logoutBtn" class="danger hidden">Выйти</button>
      </div>
    </header>

    <main>
      <aside>
        <div class="card" id="authCard">
          <h2>Вход</h2>
          <div class="auth-grid">
            <button class="btn primary" id="googleBtn">Google</button>
            <button class="btn" id="guestHintBtn" type="button">Email</button>
          </div>

          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" />

          <label for="password">Пароль</label>
          <input id="password" type="password" placeholder="Пароль" />

          <div class="auth-grid" style="margin-top:12px;">
            <button class="btn primary" id="signUpBtn">Регистрация</button>
            <button class="btn" id="signInBtn">Вход</button>
          </div>

          <div class="muted" style="margin-top:10px;">
            После входа нужно один раз занять никнейм.
          </div>
        </div>

        <div class="card hidden" id="profileCard">
          <h2>Никнейм</h2>
          <div class="muted" id="profileInfo">—</div>
          <label for="username">Придумай username</label>
          <input id="username" type="text" placeholder="например: mark_12" />
          <button class="btn primary" id="claimUsernameBtn" style="margin-top:10px; width:100%;">Занять ник</button>
          <div class="muted" style="margin-top:10px;">Только a-z, 0-9 и подчёркивание.</div>
        </div>

        <div class="card hidden" id="newChatCard">
          <h2>Новый чат</h2>
          <label for="findUser">Username собеседника</label>
          <input id="findUser" type="text" placeholder="например: ivan_777" />
          <button class="btn primary" id="openChatBtn" style="margin-top:10px; width:100%;">Открыть чат</button>
          <div class="muted" style="margin-top:10px;">Сначала собеседник должен тоже зайти и занять ник.</div>
        </div>

        <div class="card hidden" id="chatListCard">
          <h2>Диалоги</h2>
          <div class="chat-list" id="chatList"></div>
        </div>
      </aside>

      <section>
        <div class="chat-top">
          <div>
            <h2 id="chatTitle">Чат не выбран</h2>
            <div class="muted" id="chatSubtitle">Выбери собеседника по username</div>
          </div>
          <div class="chat-actions">
            <button class="btn" id="deselectBtn" type="button">Снять выбор</button>
            <button class="btn" id="forwardSelectedBtn" type="button">Переслать</button>
            <button class="btn" id="deleteSelectedBtn" type="button">Удалить выбранные</button>
            <button class="btn danger" id="clearChatBtn" type="button">Очистить чат</button>
          </div>
        </div>

        <div id="messages" class="messages">
          <div class="status">Сначала войди в аккаунт, потом задай username.</div>
        </div>

        <div class="composer hidden" id="composer">
          <div class="status hidden" id="composerStatus"></div>
          <div class="send-row">
            <button class="btn icon-btn" id="toggleImageBtn" type="button" title="Отправить картинку">🖼</button>
            <textarea id="messageText" placeholder="Напиши сообщение..."></textarea>
            <button class="btn primary" id="sendBtn">Отправить</button>
          </div>
          <div class="image-row hidden" id="imageRow">
            <label for="imageUrl">Ссылка на картинку</label>
            <input id="imageUrl" type="url" placeholder="https://..." />
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
    import {
      getAuth,
      GoogleAuthProvider,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signInWithPopup,
      signOut,
      onAuthStateChanged,
      updateProfile
    } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      addDoc,
      collection,
      query,
      where,
      orderBy,
      limit,
      onSnapshot,
      serverTimestamp,
      runTransaction,
      updateDoc,
      deleteDoc
    } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyC54igVqsMXIRriBZwiq1w6knBTnkfKIe4",
      authDomain: "nova-prospect-chat.firebaseapp.com",
      projectId: "nova-prospect-chat",
      storageBucket: "nova-prospect-chat.firebasestorage.app",
      messagingSenderId: "256806164650",
      appId: "1:256806164650:web:dd8faf7b8f11b68001d8d3",
      measurementId: "G-9V0Q2E2FNB"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    const $ = (id) => document.getElementById(id);
    const state = {
      user: null,
      profile: null,
      currentChatId: null,
      currentChatPeer: null,
      chatMeta: null,
      messagesCache: [],
      selectedMessageIds: new Set(),
      unsubMessages: null,
      unsubChats: null,
      unsubChatDoc: null,
      imageMode: false
    };

    const els = {
      headerMe: $('headerMe'),
      refreshBtn: $('refreshBtn'),
      logoutBtn: $('logoutBtn'),
      authCard: $('authCard'),
      profileCard: $('profileCard'),
      newChatCard: $('newChatCard'),
      chatListCard: $('chatListCard'),
      email: $('email'),
      password: $('password'),
      googleBtn: $('googleBtn'),
      signUpBtn: $('signUpBtn'),
      signInBtn: $('signInBtn'),
      username: $('username'),
      claimUsernameBtn: $('claimUsernameBtn'),
      profileInfo: $('profileInfo'),
      findUser: $('findUser'),
      openChatBtn: $('openChatBtn'),
      chatTitle: $('chatTitle'),
      chatSubtitle: $('chatSubtitle'),
      chatState: $('chatState'),
      messages: $('messages'),
      composer: $('composer'),
      composerStatus: $('composerStatus'),
      messageText: $('messageText'),
      sendBtn: $('sendBtn'),
      chatList: $('chatList'),
      imageRow: $('imageRow'),
      imageUrl: $('imageUrl'),
      toggleImageBtn: $('toggleImageBtn'),
      clearChatBtn: $('clearChatBtn'),
      deleteSelectedBtn: $('deleteSelectedBtn'),
      forwardSelectedBtn: $('forwardSelectedBtn'),
      deselectBtn: $('deselectBtn')
    };

    function normUsername(value) {
      return String(value || '').trim().toLowerCase();
    }

    function validUsername(value) {
      return /^[a-z0-9_]{3,20}$/.test(value);
    }

    function chatIdFor(a, b) {
      return [a, b].sort().join('__');
    }

    function tsToMillis(ts, fallback = 0) {
      if (!ts) return fallback;
      if (typeof ts.toMillis === 'function') return ts.toMillis();
      if (typeof ts.toDate === 'function') return ts.toDate().getTime();
      const d = new Date(ts);
      return Number.isNaN(d.getTime()) ? fallback : d.getTime();
    }

    function fmtTime(ts) {
      if (!ts) return '';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return new Intl.DateTimeFormat('ru-RU', {
        hour: '2-digit', minute: '2-digit'
      }).format(d);
    }

    function setStatus(message, isError = false) {
      els.composerStatus.textContent = message;
      els.composerStatus.classList.toggle('hidden', !message);
      els.composerStatus.classList.toggle('error', isError);
    }

    function toggleImageMode(force) {
      state.imageMode = typeof force === 'boolean' ? force : !state.imageMode;
      els.imageRow.classList.toggle('hidden', !state.imageMode);
      els.toggleImageBtn.classList.toggle('primary', state.imageMode);
      if (state.imageMode) {
        els.imageUrl.focus();
      } else {
        els.imageUrl.value = '';
      }
    }

    function clearSelection() {
      state.selectedMessageIds.clear();
      refreshHeaderState();
      if (state.messagesCache.length) renderMessages(state.messagesCache);
    }

    function refreshHeaderState() {
      if (!state.currentChatId) {
        els.chatState.textContent = '';
        els.deleteSelectedBtn.disabled = true;
        els.forwardSelectedBtn.disabled = true;
        els.deselectBtn.disabled = true;
        els.clearChatBtn.disabled = true;
        return;
      }
      const count = state.selectedMessageIds.size;
      els.chatState.textContent = count ? `${count} выбрано` : `Чат: ${state.currentChatId}`;
      const disabled = count === 0;
      els.deleteSelectedBtn.disabled = disabled;
      els.forwardSelectedBtn.disabled = disabled;
      els.deselectBtn.disabled = disabled;
      els.clearChatBtn.disabled = false;
    }

    function showOnlyAuth() {
      els.authCard.classList.remove('hidden');
      els.profileCard.classList.add('hidden');
      els.newChatCard.classList.add('hidden');
      els.chatListCard.classList.add('hidden');
      els.logoutBtn.classList.add('hidden');
      els.composer.classList.add('hidden');
      els.chatTitle.textContent = 'Чат не выбран';
      els.chatSubtitle.textContent = 'Сначала войди в аккаунт';
      els.chatState.textContent = '';
      els.messages.innerHTML = '<div class="status">Сначала войди в аккаунт, потом задай username.</div>';
      els.deleteSelectedBtn.disabled = true;
      els.forwardSelectedBtn.disabled = true;
      els.deselectBtn.disabled = true;
      els.clearChatBtn.disabled = true;
    }

    async function ensureUserDoc(user) {
      const ref = doc(db, 'users', user.uid);
      const snap = await getDoc(ref);
      if (!snap.exists()) {
        await setDoc(ref, {
          uid: user.uid,
          email: user.email || '',
          displayName: user.displayName || '',
          username: '',
          createdAt: serverTimestamp()
        });
      }
      return await getDoc(ref);
    }

    function setLoggedInShell(user, profile) {
      els.authCard.classList.add('hidden');
      els.profileCard.classList.remove('hidden');
      els.newChatCard.classList.remove('hidden');
      els.chatListCard.classList.remove('hidden');
      els.logoutBtn.classList.remove('hidden');
      els.headerMe.textContent = profile?.username ? `@${profile.username}` : (user.email || user.displayName || user.uid);
      els.profileInfo.textContent = `UID: ${user.uid}`;
      els.composer.classList.toggle('hidden', !state.currentChatId);
      refreshHeaderState();
    }

    async function claimUsername() {
      const raw = normUsername(els.username.value);
      if (!validUsername(raw)) {
        setStatus('Username должен быть 3–20 символов: a-z, 0-9 и _', true);
        return;
      }
      if (!state.user) return;

      const usernameRef = doc(db, 'usernames', raw);
      const userRef = doc(db, 'users', state.user.uid);

      try {
        await runTransaction(db, async (tx) => {
          const [nameSnap, userSnap] = await Promise.all([tx.get(usernameRef), tx.get(userRef)]);
          if (nameSnap.exists()) {
            throw new Error('Такой username уже занят');
          }
          if (!userSnap.exists()) {
            tx.set(userRef, {
              uid: state.user.uid,
              email: state.user.email || '',
              displayName: state.user.displayName || '',
              username: raw,
              createdAt: serverTimestamp()
            });
          } else {
            tx.update(userRef, { username: raw });
          }
          tx.set(usernameRef, {
            uid: state.user.uid,
            username: raw,
            createdAt: serverTimestamp()
          });
        });

        await updateProfile(state.user, { displayName: raw });
        state.profile = { ...(state.profile || {}), username: raw };
        els.headerMe.textContent = `@${raw}`;
        setStatus('Никнейм занят. Теперь можно открывать чаты.');
      } catch (err) {
        setStatus(err.message || 'Не удалось занять username', true);
      }
    }

    async function openChatByUsername() {
      const targetUsername = normUsername(els.findUser.value);
      if (!state.user || !state.profile?.username) {
        setStatus('Сначала войди и займи свой username.', true);
        return;
      }
      if (!targetUsername) {
        setStatus('Введите username собеседника.', true);
        return;
      }
      if (targetUsername === state.profile.username) {
        setStatus('Сам с собой тоже можно, но смысла мало.', true);
        return;
      }

      const targetSnap = await getDoc(doc(db, 'usernames', targetUsername));
      if (!targetSnap.exists()) {
        setStatus('Пользователь с таким username не найден.', true);
        return;
      }

      const targetUid = targetSnap.data().uid;
      const targetUserSnap = await getDoc(doc(db, 'users', targetUid));
      const targetProfile = targetUserSnap.exists() ? targetUserSnap.data() : { username: targetUsername };
      const chatId = chatIdFor(state.user.uid, targetUid);

      await setDoc(doc(db, 'chats', chatId), {
        members: [state.user.uid, targetUid],
        memberNames: {
          [state.user.uid]: state.profile.username,
          [targetUid]: targetProfile.username || targetUsername
        },
        updatedAt: serverTimestamp(),
        lastMessage: ''
      }, { merge: true });

      attachChat(chatId, targetProfile.username || targetUsername, targetUid);
      els.findUser.value = '';
    }

    function makeMessageNode(m) {
      const mine = state.user && m.senderId === state.user.uid;
      const selected = state.selectedMessageIds.has(m.id);
      const deleted = !!m.deleted;
      const card = document.createElement('article');
      card.className = `msg ${mine ? 'me' : ''} ${selected ? 'selected' : ''} ${deleted ? 'deleted' : ''}`;
      card.dataset.messageid = m.id;

      const meta = document.createElement('div');
      meta.className = 'meta';

      const sender = document.createElement('span');
      sender.textContent = deleted ? 'Сообщение' : (m.senderName || (mine ? 'Вы' : 'Пользователь'));

      const actions = document.createElement('div');
      actions.className = 'msg-actions';

      const time = document.createElement('span');
      time.textContent = fmtTime(m.createdAt);

      const selectBtn = document.createElement('button');
      selectBtn.className = 'msg-btn';
      selectBtn.type = 'button';
      selectBtn.textContent = selected ? '☑' : '☐';
      selectBtn.title = 'Выбрать сообщение';
      selectBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleMessageSelection(m.id);
      });

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'msg-btn';
      deleteBtn.type = 'button';
      deleteBtn.textContent = 'Удалить';
      deleteBtn.title = 'Удалить сообщение';
      deleteBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        await deleteSingleMessage(m.id);
      });

      actions.appendChild(time);
      actions.appendChild(selectBtn);
      actions.appendChild(deleteBtn);
      meta.appendChild(sender);
      meta.appendChild(actions);

      const body = document.createElement('div');
      body.className = 'text';
      body.textContent = deleted ? 'Сообщение удалено' : (m.text || (m.imageUrl ? '' : ''));

      card.appendChild(meta);
      if (m.imageUrl && !deleted) {
        const img = document.createElement('img');
        img.className = 'msg-image';
        img.alt = 'Картинка';
        img.src = m.imageUrl;
        img.loading = 'lazy';
        card.appendChild(img);
      }
      card.appendChild(body);

      card.addEventListener('click', (e) => {
        if (e.target.closest('button')) return;
        toggleMessageSelection(m.id);
      });

      return card;
    }

    function renderMessages(items) {
      state.messagesCache = items || [];
      const clearedAt = tsToMillis(state.chatMeta?.clearedAt, 0);
      const visible = state.messagesCache.filter((m) => {
        const created = tsToMillis(m.createdAt, Date.now());
        return !clearedAt || created > clearedAt;
      });

      els.messages.innerHTML = '';
      if (!visible.length) {
        const empty = document.createElement('div');
        empty.className = 'status';
        empty.textContent = 'Тут пока пусто. Напиши первое сообщение.';
        els.messages.appendChild(empty);
        refreshHeaderState();
        return;
      }

      const frag = document.createDocumentFragment();
      visible.forEach((m) => frag.appendChild(makeMessageNode(m)));
      els.messages.appendChild(frag);
      els.messages.scrollTop = els.messages.scrollHeight;
      refreshHeaderState();
    }

    function renderChatList(chats) {
      if (!chats.length) {
        els.chatList.innerHTML = '<div class="muted">Пока нет диалогов.</div>';
        return;
      }
      els.chatList.innerHTML = chats.map((c) => {
        const active = c.id === state.currentChatId ? 'active' : '';
        const title = c.peerName || 'Чат';
        const preview = c.lastMessage || 'Без сообщений';
        const time = c.updatedAt ? fmtTime(c.updatedAt) : '';
        return `
          <div class="chat-item ${active}" data-chatid="${c.id}" data-peername="${title}" data-peeruid="${c.peerUid || ''}">
            <div class="top"><div class="name">@${title}</div><div class="time">${time}</div></div>
            <div class="preview"></div>
          </div>
        `;
      }).join('');

      chats.forEach((c, idx) => {
        const node = els.chatList.children[idx]?.querySelector('.preview');
        if (node) node.textContent = c.lastMessage || 'Без сообщений';
      });

      [...els.chatList.querySelectorAll('.chat-item')].forEach((el) => {
        el.addEventListener('click', () => {
          attachChat(el.dataset.chatid, el.dataset.peername, el.dataset.peeruid);
        });
      });
    }

    function detachChat() {
      if (state.unsubMessages) {
        state.unsubMessages();
        state.unsubMessages = null;
      }
      if (state.unsubChatDoc) {
        state.unsubChatDoc();
        state.unsubChatDoc = null;
      }
    }

    function setCurrentChat(chatId, peerName, peerUid) {
      state.currentChatId = chatId;
      state.currentChatPeer = { name: peerName, uid: peerUid };
      state.selectedMessageIds.clear();
      state.messagesCache = [];
      els.chatTitle.textContent = `@${peerName}`;
      els.chatSubtitle.textContent = peerUid ? `UID: ${peerUid}` : '';
      els.composer.classList.remove('hidden');
      els.messages.innerHTML = '<div class="status">Загрузка...</div>';
      refreshHeaderState();
    }

    function attachChat(chatId, peerName, peerUid) {
      detachChat();
      setCurrentChat(chatId, peerName, peerUid);

      state.unsubChatDoc = onSnapshot(doc(db, 'chats', chatId), (snap) => {
        state.chatMeta = snap.exists() ? snap.data() : null;
        refreshHeaderState();
        renderMessages(state.messagesCache);
      }, (err) => {
        els.messages.innerHTML = `<div class="status error">${err.message}</div>`;
      });

      const q = query(
        collection(db, 'chats', chatId, 'messages'),
        orderBy('createdAt', 'asc'),
        limit(200)
      );

      state.unsubMessages = onSnapshot(q, (snap) => {
        const items = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        renderMessages(items);
      }, (err) => {
        els.messages.innerHTML = `<div class="status error">${err.message}</div>`;
      });

      updateChatListSelection();
    }

    function updateChatListSelection() {
      [...els.chatList.querySelectorAll('.chat-item')].forEach((el) => {
        el.classList.toggle('active', el.dataset.chatid === state.currentChatId);
      });
    }

    function toggleMessageSelection(messageId) {
      if (!messageId) return;
      if (state.selectedMessageIds.has(messageId)) {
        state.selectedMessageIds.delete(messageId);
      } else {
        state.selectedMessageIds.add(messageId);
      }
      renderMessages(state.messagesCache);
    }

    async function deleteSingleMessage(messageId) {
      if (!state.currentChatId) return;
      const ok = confirm('Удалить это сообщение?');
      if (!ok) return;
      try {
        await deleteDoc(doc(db, 'chats', state.currentChatId, 'messages', messageId));
        state.selectedMessageIds.delete(messageId);
        setStatus('Сообщение удалено.');
      } catch (err) {
        setStatus(err.message || 'Не удалось удалить сообщение', true);
      }
    }

    async function deleteSelectedMessages() {
      if (!state.currentChatId || !state.selectedMessageIds.size) return;
      const ok = confirm(`Удалить выбранные сообщения: ${state.selectedMessageIds.size}?`);
      if (!ok) return;
      const ids = [...state.selectedMessageIds];
      try {
        for (const id of ids) {
          await deleteDoc(doc(db, 'chats', state.currentChatId, 'messages', id));
        }
        state.selectedMessageIds.clear();
        setStatus('Выбранные сообщения удалены.');
      } catch (err) {
        setStatus(err.message || 'Не удалось удалить выбранные сообщения', true);
      }
    }

    async function clearChat() {
      if (!state.currentChatId || !state.user) return;
      const ok = confirm('Очистить весь чат? Сообщения пропадут у тебя сразу.');
      if (!ok) return;
      try {
        await updateDoc(doc(db, 'chats', state.currentChatId), {
          clearedAt: serverTimestamp(),
          clearedBy: state.user.uid,
          updatedAt: serverTimestamp(),
          lastMessage: ''
        });
        state.selectedMessageIds.clear();
        setStatus('Чат очищен.');
      } catch (err) {
        setStatus(err.message || 'Не удалось очистить чат', true);
      }
    }

    async function forwardSelectedMessages() {
      if (!state.currentChatId || !state.selectedMessageIds.size) return;
      const targetUsername = normUsername(prompt('Кому переслать? Введи username:', '') || '');
      if (!targetUsername) return;
      if (!state.user || !state.profile?.username) {
        setStatus('Сначала займи username.', true);
        return;
      }
      try {
        const targetUserSnap = await getDoc(doc(db, 'usernames', targetUsername));
        if (!targetUserSnap.exists()) {
          setStatus('Такой username не найден.', true);
          return;
        }
        const targetUid = targetUserSnap.data().uid;
        if (targetUid === state.user.uid) {
          setStatus('Пересылать самому себе можно, но это странно.', true);
          return;
        }
        const targetProfileSnap = await getDoc(doc(db, 'users', targetUid));
        const targetProfile = targetProfileSnap.exists() ? targetProfileSnap.data() : { username: targetUsername };
        const targetChatId = chatIdFor(state.user.uid, targetUid);

        await setDoc(doc(db, 'chats', targetChatId), {
          members: [state.user.uid, targetUid],
          memberNames: {
            [state.user.uid]: state.profile.username,
            [targetUid]: targetProfile.username || targetUsername
          },
          updatedAt: serverTimestamp(),
          lastMessage: ''
        }, { merge: true });

        const selected = state.messagesCache
          .filter((m) => state.selectedMessageIds.has(m.id))
          .sort((a, b) => tsToMillis(a.createdAt, 0) - tsToMillis(b.createdAt, 0));

        let lastPreview = '';
        for (const m of selected) {
          if (tsToMillis(m.createdAt, Date.now()) <= tsToMillis(state.chatMeta?.clearedAt, 0)) continue;
          const payload = {
            senderId: state.user.uid,
            senderName: state.profile.username,
            text: m.deleted ? 'Сообщение удалено' : (m.text || ''),
            imageUrl: m.deleted ? '' : (m.imageUrl || ''),
            forwardedFrom: m.senderName || m.senderId || '',
            createdAt: serverTimestamp()
          };
          await addDoc(collection(db, 'chats', targetChatId, 'messages'), payload);
          lastPreview = payload.imageUrl ? '🖼 Картинка' : (payload.text || lastPreview);
        }

        await updateDoc(doc(db, 'chats', targetChatId), {
          updatedAt: serverTimestamp(),
          lastMessage: (lastPreview || 'Сообщения пересланы').slice(0, 140)
        });

        state.selectedMessageIds.clear();
        setStatus('Сообщения пересланы.');
      } catch (err) {
        setStatus(err.message || 'Не удалось переслать сообщения', true);
      }
    }

    function sanitizeImageUrl(value) {
      const v = String(value || '').trim();
      if (!v) return '';
      if (!/^https?:\/\//i.test(v)) return '';
      return v;
    }

    async function sendMessage() {
      const text = els.messageText.value.trim();
      const imageUrl = state.imageMode ? sanitizeImageUrl(els.imageUrl.value) : '';
      if (!text && !imageUrl) return;
      if (!state.user || !state.profile?.username || !state.currentChatId) {
        setStatus('Сначала открой чат и займи username.', true);
        return;
      }

      const chatRef = doc(db, 'chats', state.currentChatId);
      const msgRef = collection(db, 'chats', state.currentChatId, 'messages');

      try {
        await addDoc(msgRef, {
          senderId: state.user.uid,
          senderName: state.profile.username,
          text,
          imageUrl,
          createdAt: serverTimestamp()
        });

        await updateDoc(chatRef, {
          lastMessage: imageUrl && !text ? '🖼 Картинка' : (text || '🖼 Картинка').slice(0, 140),
          updatedAt: serverTimestamp()
        });

        els.messageText.value = '';
        els.imageUrl.value = '';
        if (state.imageMode) toggleImageMode(false);
        setStatus('');
      } catch (err) {
        setStatus(err.message || 'Не удалось отправить сообщение', true);
      }
    }

    async function refreshChats() {
      if (!state.user) return;
      if (state.unsubChats) {
        state.unsubChats();
        state.unsubChats = null;
      }

      const q = query(
        collection(db, 'chats'),
        where('members', 'array-contains', state.user.uid)
      );

      state.unsubChats = onSnapshot(q, async (snap) => {
        const chats = await Promise.all(snap.docs.map(async (d) => {
          const data = d.data();
          const peerUid = (data.members || []).find((x) => x !== state.user.uid);
          let peerName = peerUid;
          if (data.memberNames && peerUid && data.memberNames[peerUid]) {
            peerName = data.memberNames[peerUid];
          } else if (peerUid) {
            const userSnap = await getDoc(doc(db, 'users', peerUid));
            if (userSnap.exists() && userSnap.data().username) peerName = userSnap.data().username;
          }
          return {
            id: d.id,
            peerUid,
            peerName,
            lastMessage: data.lastMessage || '',
            updatedAt: data.updatedAt || null
          };
        }));
        renderChatList(chats);
        updateChatListSelection();
      }, (err) => {
        els.chatList.innerHTML = `<div class="status error">${err.message}</div>`;
      });
    }

    async function bootProfile(user) {
      const snap = await ensureUserDoc(user);
      const data = snap.data() || {};
      state.profile = data;
      setLoggedInShell(user, data);
      if (!data.username) {
        els.profileInfo.textContent = `UID: ${user.uid}. Сейчас username не занят.`;
      } else {
        els.profileInfo.textContent = `Твой username: @${data.username}`;
        els.username.value = data.username;
      }
      await refreshChats();
    }

    async function signUp() {
      try {
        const email = els.email.value.trim();
        const password = els.password.value;
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await ensureUserDoc(cred.user);
      } catch (err) {
        alert(err.message);
      }
    }

    async function signIn() {
      try {
        const email = els.email.value.trim();
        const password = els.password.value;
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        alert(err.message);
      }
    }

    async function signInGoogle() {
      try {
        await signInWithPopup(auth, googleProvider);
      } catch (err) {
        alert(err.message);
      }
    }

    async function doLogout() {
      await signOut(auth);
    }

    els.claimUsernameBtn.addEventListener('click', claimUsername);
    els.openChatBtn.addEventListener('click', openChatByUsername);
    els.sendBtn.addEventListener('click', sendMessage);
    els.signUpBtn.addEventListener('click', signUp);
    els.signInBtn.addEventListener('click', signIn);
    els.googleBtn.addEventListener('click', signInGoogle);
    els.logoutBtn.addEventListener('click', doLogout);
    els.refreshBtn.addEventListener('click', refreshChats);
    els.toggleImageBtn.addEventListener('click', () => toggleImageMode());
    els.clearChatBtn.addEventListener('click', clearChat);
    els.deleteSelectedBtn.addEventListener('click', deleteSelectedMessages);
    els.forwardSelectedBtn.addEventListener('click', forwardSelectedMessages);
    els.deselectBtn.addEventListener('click', clearSelection);
    els.messageText.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    onAuthStateChanged(auth, async (user) => {
      detachChat();
      if (state.unsubChats) {
        state.unsubChats();
        state.unsubChats = null;
      }
      state.user = user || null;
      state.profile = null;
      state.currentChatId = null;
      state.currentChatPeer = null;
      state.chatMeta = null;
      state.messagesCache = [];
      state.selectedMessageIds.clear();
      els.chatTitle.textContent = 'Чат не выбран';
      els.chatSubtitle.textContent = 'Выбери собеседника по username';
      els.chatState.textContent = '';
      els.messages.innerHTML = '<div class="status">Сначала войди в аккаунт, потом задай username.</div>';
      els.composer.classList.add('hidden');
      toggleImageMode(false);
      refreshHeaderState();

      if (!user) {
        showOnlyAuth();
        return;
      }

      await bootProfile(user);
    });

    showOnlyAuth();
  </script>
</body>
</html>
