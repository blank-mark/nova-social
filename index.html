<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nova Prospect Chat</title>
<style>

body{
font-family:Arial;
background:#111;
color:white;
padding:20px;
}

input{
margin:5px;
padding:5px;
}

button{
margin:5px;
padding:5px;
}

.box{
border:1px solid gray;
padding:10px;
margin-top:10px;
}

</style>
</head>

<body>

<h2>Nova Prospect Chat</h2>

<div class="box">

<h3>Авторизация</h3>

<input id="email" placeholder="email">
<input id="password" placeholder="password">

<button onclick="register()">Регистрация</button>
<button onclick="login()">Вход</button>
<button onclick="googleLogin()">Google</button>

</div>

<div class="box">

<h3>Логин</h3>

<input id="username" placeholder="придумай логин">
<button onclick="setUsername()">Сохранить</button>

<p id="me"></p>

</div>

<div class="box">

<h3>Добавить друга</h3>

<input id="addFriendName" placeholder="логин друга">
<button onclick="sendRequest()">Отправить</button>

</div>

<div class="box">

<h3>Заявки</h3>

<div id="requests"></div>

</div>

<div class="box">

<h3>Друзья</h3>

<div id="friends"></div>

</div>

<div class="box">

<h3>Звонок</h3>

<button onclick="startCall()">Начать звонок</button>
<button onclick="hangup()">Завершить</button>

<audio id="remoteAudio" autoplay></audio>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"

import {
getFirestore,
doc,
setDoc,
getDoc,
collection,
addDoc,
query,
where,
getDocs,
onSnapshot,
updateDoc
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"

const firebaseConfig = {

apiKey: "AIzaSyC54igVqsMXIRriBZwiq1w6knBTnkfKIe4",
authDomain: "nova-prospect-chat.firebaseapp.com",
projectId: "nova-prospect-chat",
storageBucket: "nova-prospect-chat.firebasestorage.app",
messagingSenderId: "256806164650",
appId: "1:256806164650:web:dd8faf7b8f11b68001d8d3",
measurementId: "G-9V0Q2E2FNB"

}

const app = initializeApp(firebaseConfig)

const auth = getAuth()

const db = getFirestore()

let me = null

window.register = async function(){

let email = email.value
let pass = password.value

await createUserWithEmailAndPassword(auth,email,pass)

}

window.login = async function(){

let email = email.value
let pass = password.value

await signInWithEmailAndPassword(auth,email,pass)

}

window.googleLogin = async function(){

let provider = new GoogleAuthProvider()

await signInWithPopup(auth,provider)

}

window.setUsername = async function(){

let name = username.value

await setDoc(doc(db,"users",me.uid),{

username:name

})

}

onAuthStateChanged(auth,async user=>{

if(!user)return

me=user

meText()

loadRequests()

loadFriends()

})

function meText(){

getDoc(doc(db,"users",me.uid)).then(d=>{

if(d.exists()){

me.innerText="Вы: "+d.data().username

}

})

}

window.sendRequest = async function(){

let name = addFriendName.value

let q=query(collection(db,"users"),where("username","==",name))

let snap=await getDocs(q)

snap.forEach(async docu=>{

await addDoc(collection(db,"requests"),{

from:me.uid,
to:docu.id

})

})

}

function loadRequests(){

let q=query(collection(db,"requests"),where("to","==",me.uid))

onSnapshot(q,snap=>{

requests.innerHTML=""

snap.forEach(docu=>{

let d=docu.data()

let btn=document.createElement("button")

btn.innerText="Принять"

btn.onclick=async()=>{

await addDoc(collection(db,"friends"),{

a:me.uid,
b:d.from

})

}

requests.appendChild(btn)

})

})

}

function loadFriends(){

let q=query(collection(db,"friends"),where("a","==",me.uid))

onSnapshot(q,snap=>{

friends.innerHTML=""

snap.forEach(docu=>{

let d=docu.data()

let div=document.createElement("div")

div.innerText="друг: "+d.b

friends.appendChild(div)

})

})

}

let pc=null
let stream=null

window.startCall=async function(){

stream=await navigator.mediaDevices.getUserMedia({audio:true})

pc=new RTCPeerConnection({

iceServers:[{urls:"stun:stun.l.google.com:19302"}]

})

stream.getTracks().forEach(t=>pc.addTrack(t,stream))

pc.ontrack=e=>{

remoteAudio.srcObject=e.streams[0]

}

}

window.hangup=function(){

if(pc)pc.close()

if(stream){

stream.getTracks().forEach(t=>t.stop())

}

}

</script>

</body>
</html>
