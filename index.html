<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Prospect Chat</title>
  <style>
    :root {
      --bg: #f4f4f4;
      --panel: #ffffff;
      --text: #111111;
      --muted: #666666;
      --line: #d9d9d9;
      --accent: #2f6fed;
      --accent2: #2458bd;
      --danger: #b42318;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 18px;
    }

    header .me {
      color: var(--muted);
      font-size: 14px;
    }

    header button,
    .btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    header button:hover,
    .btn:hover { border-color: #b8b8b8; }

    header .danger {
      border-color: #f1b8b3;
      color: var(--danger);
    }

    main {
      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: 0;
    }

    aside, section {
      min-height: 0;
      overflow: auto;
    }

    aside {
      border-right: 1px solid var(--line);
      background: #fafafa;
      padding: 16px;
    }

    section {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      background: var(--panel);
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .card h2, .card h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      margin: 10px 0 6px;
      color: var(--muted);
    }

    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    textarea {
      resize: none;
      min-height: 46px;
      max-height: 120px;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .row > * { flex: 1; }
    .row .btn { flex: 0 0 auto; }

    .muted { color: var(--muted); font-size: 13px; }
    .hidden { display: none !important; }

    .chat-list {
      display: grid;
      gap: 10px;
    }

    .chat-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 12px;
      cursor: pointer;
    }

    .chat-item.active {
      border-color: var(--accent);
      background: #f7faff;
    }

    .chat-item .top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-bottom: 4px;
    }

    .chat-item .name {
      font-weight: 700;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-item .time {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .chat-item .preview {
      font-size: 13px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-top {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .chat-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .small-btn {
      padding: 7px 10px;
      font-size: 12px;
      border-radius: 999px;
    }

    .msg {
      position: relative;
      max-width: min(680px, 100%);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
      background: #fff;
      cursor: pointer;
      user-select: none;
    }

    .msg.selected {
      outline: 2px solid var(--accent);
      box-shadow: 0 0 0 4px rgba(47, 111, 237, 0.12);
    }

    .msg .image-wrap {
      margin-top: 8px;
    }

    .msg img {
      display: block;
      max-width: 100%;
      border-radius: 12px;
    }

    .chat-item {
      position: relative;
    }

    .chat-item .clear-chat-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      border: 0;
      background: transparent;
      color: var(--danger);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 2px 4px;
    }

    .composer .send-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .composer .send-row textarea {
      flex: 1;
    }

    .icon-btn {
      width: 40px;
      min-width: 40px;
      padding: 10px 0;
      text-align: center;
    }


    .chat-top h2 {
      margin: 0;
      font-size: 16px;
    }

    .messages {
      padding: 16px 18px;
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .msg {
      max-width: min(680px, 100%);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
      background: #fff;
    }

    .msg.me {
      margin-left: auto;
      background: #f4f8ff;
      border-color: #c8d8ff;
    }

    .msg .meta {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .msg .text {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
      line-height: 1.35;
    }

    .composer {
      border-top: 1px solid var(--line);
      padding: 14px 18px;
      display: grid;
      gap: 10px;
    }

    .composer .send-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .composer .send-row textarea {
      flex: 1;
    }

    .primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .primary:hover { background: var(--accent2); }

    .auth-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .status {
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #f1f5ff;
      border: 1px solid #d6e0ff;
      color: #234;
      margin-bottom: 12px;
    }

    .error {
      background: #fff5f5;
      border-color: #ffd0cf;
      color: var(--danger);
    }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Nova Prospect Chat</h1>
        <div class="me" id="headerMe">Не вошёл</div>
      </div>
      <div class="row" style="gap:10px; flex:0 0 auto;">
        <button id="refreshBtn" title="Обновить список">Обновить</button>
        <button id="logoutBtn" class="danger hidden">Выйти</button>
      </div>
    </header>

    <main>
      <aside>
        <div class="card" id="authCard">
          <h2>Вход</h2>
          <div class="auth-grid">
            <button class="btn primary" id="googleBtn">Google</button>
            <button class="btn" id="guestHintBtn" type="button">Email</button>
          </div>

          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" />

          <label for="password">Пароль</label>
          <input id="password" type="password" placeholder="Пароль" />

          <div class="auth-grid" style="margin-top:12px;">
            <button class="btn primary" id="signUpBtn">Регистрация</button>
            <button class="btn" id="signInBtn">Вход</button>
          </div>

          <div class="muted" style="margin-top:10px;">
            После входа нужно один раз занять никнейм.
          </div>
        </div>

        <div class="card hidden" id="profileCard">
          <h2>Никнейм</h2>
          <div class="muted" id="profileInfo">—</div>
          <label for="username">Придумай username</label>
          <input id="username" type="text" placeholder="например: mark_12" />
          <button class="btn primary" id="claimUsernameBtn" style="margin-top:10px; width:100%;">Занять ник</button>
          <div class="muted" style="margin-top:10px;">Только a-z, 0-9 и подчёркивание.</div>
        </div>

        <div class="card hidden" id="newChatCard">
          <h2>Новый чат</h2>
          <label for="findUser">Username собеседника</label>
          <input id="findUser" type="text" placeholder="например: ivan_777" />
          <button class="btn primary" id="openChatBtn" style="margin-top:10px; width:100%;">Открыть чат</button>
          <div class="muted" style="margin-top:10px;">Сначала собеседник должен тоже зайти и занять ник.</div>
        </div>

        <div class="card hidden" id="chatListCard">
          <h2>Диалоги</h2>
          <div class="chat-list" id="chatList"></div>
        </div>
      </aside>

      <section>
        <div class="chat-top">
          <div>
            <h2 id="chatTitle">Чат не выбран</h2>
            <div class="muted" id="chatSubtitle">Выбери собеседника по username</div>
          </div>
          <div class="chat-actions">
            <div class="muted" id="chatState"></div>
            <button class="btn small-btn danger hidden" id="deleteSelectedBtn">Удалить выбранные</button>
            <button class="btn small-btn danger hidden" id="clearChatBtn">Очистить чат</button>
          </div>
        </div>

        <div id="messages" class="messages">
          <div class="status">Сначала войди в аккаунт, потом задай username.</div>
        </div>

        <div class="composer hidden" id="composer">
          <div class="status hidden" id="composerStatus"></div>
          <div class="send-row">
            <textarea id="messageText" placeholder="Напиши сообщение..."></textarea>
            <button class="btn icon-btn" id="imageBtn" title="Отправить картинку по ссылке">🖼</button>
            <button class="btn primary" id="sendBtn">Отправить</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
    import {
      getAuth,
      GoogleAuthProvider,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signInWithPopup,
      signOut,
      onAuthStateChanged,
      updateProfile
    } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      addDoc,
      collection,
      query,
      where,
      orderBy,
      limit,
      onSnapshot,
      serverTimestamp,
      runTransaction,
      updateDoc,
      deleteDoc,
      getDocs
    } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyC54igVqsMXIRriBZwiq1w6knBTnkfKIe4",
      authDomain: "nova-prospect-chat.firebaseapp.com",
      projectId: "nova-prospect-chat",
      storageBucket: "nova-prospect-chat.firebasestorage.app",
      messagingSenderId: "256806164650",
      appId: "1:256806164650:web:dd8faf7b8f11b68001d8d3",
      measurementId: "G-9V0Q2E2FNB"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    const $ = (id) => document.getElementById(id);
    const state = {
      user: null,
      profile: null,
      currentChatId: null,
      currentChatPeer: null,
      unsubMessages: null,
      unsubChats: null
    };

    const els = {
      headerMe: $('headerMe'),
      refreshBtn: $('refreshBtn'),
      logoutBtn: $('logoutBtn'),
      authCard: $('authCard'),
      profileCard: $('profileCard'),
      newChatCard: $('newChatCard'),
      chatListCard: $('chatListCard'),
      email: $('email'),
      password: $('password'),
      googleBtn: $('googleBtn'),
      signUpBtn: $('signUpBtn'),
      signInBtn: $('signInBtn'),
      username: $('username'),
      claimUsernameBtn: $('claimUsernameBtn'),
      profileInfo: $('profileInfo'),
      findUser: $('findUser'),
      openChatBtn: $('openChatBtn'),
      chatTitle: $('chatTitle'),
      chatSubtitle: $('chatSubtitle'),
      chatState: $('chatState'),
      deleteSelectedBtn: $('deleteSelectedBtn'),
      clearChatBtn: $('clearChatBtn'),
      messages: $('messages'),
      composer: $('composer'),
      composerStatus: $('composerStatus'),
      messageText: $('messageText'),
      imageBtn: $('imageBtn'),
      sendBtn: $('sendBtn'),
      chatList: $('chatList')
    };

    state.selectedMessageIds = new Set();
    state.useLocal = false;

    const LOCAL_KEY = 'nova_prospect_chat_local_v2';

    function loadLocalStore() {
      try {
        return JSON.parse(localStorage.getItem(LOCAL_KEY)) || { users: {}, usernames: {}, chats: {}, messages: {} };
      } catch {
        return { users: {}, usernames: {}, chats: {}, messages: {} };
      }
    }

    function saveLocalStore(store) {
      localStorage.setItem(LOCAL_KEY, JSON.stringify(store));
    }

    function localNow() {
      return new Date().toISOString();
    }

    function localId() {
      return (crypto?.randomUUID?.() || `m_${Date.now()}_${Math.random().toString(16).slice(2)}`);
    }

    function isPermissionError(err) {
      const msg = String(err?.message || err || '').toLowerCase();
      return msg.includes('missing or insufficient permissions') || msg.includes('permission-denied') || msg.includes('insufficient permissions');
    }

    function localEnsureUser(user) {
      const store = loadLocalStore();
      if (!store.users[user.uid]) {
        store.users[user.uid] = {
          uid: user.uid,
          email: user.email || '',
          displayName: user.displayName || '',
          username: ''
        };
        saveLocalStore(store);
      }
      return store.users[user.uid];
    }

    function localClaimUsername(uid, email, displayName, raw) {
      const store = loadLocalStore();
      const currentOwner = store.usernames[raw];
      if (currentOwner && currentOwner !== uid) {
        throw new Error('Такой username уже занят');
      }
      const user = store.users[uid] || { uid, email: email || '', displayName: displayName || '', username: '' };
      if (user.username && user.username !== raw) delete store.usernames[user.username];
      user.uid = uid;
      user.email = email || user.email || '';
      user.displayName = displayName || user.displayName || '';
      user.username = raw;
      store.users[uid] = user;
      store.usernames[raw] = uid;
      saveLocalStore(store);
      return user;
    }

    function localFindUidByUsername(username) {
      const store = loadLocalStore();
      return store.usernames[username] || null;
    }

    function localGetUser(uid) {
      const store = loadLocalStore();
      return store.users[uid] || null;
    }

    function localChatIdFor(a, b) {
      return [a, b].sort().join('__');
    }

    function localUpsertChat(chatId, memberA, memberB, memberNameA, memberNameB) {
      const store = loadLocalStore();
      if (!store.chats[chatId]) {
        store.chats[chatId] = {
          id: chatId,
          members: [memberA, memberB],
          memberNames: { [memberA]: memberNameA, [memberB]: memberNameB },
          updatedAt: localNow(),
          lastMessage: ''
        };
      } else {
        store.chats[chatId].members = [memberA, memberB];
        store.chats[chatId].memberNames = { ...(store.chats[chatId].memberNames || {}), [memberA]: memberNameA, [memberB]: memberNameB };
      }
      saveLocalStore(store);
      return store.chats[chatId];
    }

    function localGetChatsFor(uid) {
      const store = loadLocalStore();
      return Object.values(store.chats)
        .filter((c) => (c.members || []).includes(uid))
        .map((c) => {
          const peerUid = (c.members || []).find((x) => x !== uid);
          const peerName = c.memberNames?.[peerUid] || localGetUser(peerUid)?.username || peerUid;
          return {
            id: c.id,
            peerUid,
            peerName,
            lastMessage: c.lastMessage || '',
            updatedAt: c.updatedAt || null
          };
        })
        .sort((a, b) => String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')));
    }

    function localGetMessages(chatId) {
      const store = loadLocalStore();
      return (store.messages[chatId] || []).slice().sort((a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
    }

    function localAddMessage(chatId, message) {
      const store = loadLocalStore();
      if (!store.messages[chatId]) store.messages[chatId] = [];
      const item = { id: localId(), createdAt: localNow(), ...message };
      store.messages[chatId].push(item);
      if (!store.chats[chatId]) {
        store.chats[chatId] = { id: chatId, members: [], memberNames: {}, updatedAt: localNow(), lastMessage: '' };
      }
      store.chats[chatId].updatedAt = item.createdAt;
      store.chats[chatId].lastMessage = item.type === 'image' ? '[Картинка]' : String(item.text || '').slice(0, 140);
      saveLocalStore(store);
      return item;
    }

    function localDeleteMessages(chatId, ids) {
      const store = loadLocalStore();
      const list = store.messages[chatId] || [];
      store.messages[chatId] = list.filter((m) => !ids.includes(m.id));
      const remaining = store.messages[chatId];
      if (store.chats[chatId]) {
        store.chats[chatId].lastMessage = remaining.length ? (remaining[remaining.length - 1].type === 'image' ? '[Картинка]' : String(remaining[remaining.length - 1].text || '').slice(0, 140)) : '';
        store.chats[chatId].updatedAt = remaining.length ? remaining[remaining.length - 1].createdAt : localNow();
      }
      saveLocalStore(store);
    }

    function localClearChat(chatId) {
      const store = loadLocalStore();
      delete store.messages[chatId];
      if (store.chats[chatId]) {
        store.chats[chatId].lastMessage = '';
        store.chats[chatId].updatedAt = localNow();
      }
      saveLocalStore(store);
    }

    function isImageUrl(text) {
      return /^https?:\/\/\S+\.(?:png|jpe?g|gif|webp|bmp|svg)(?:\?.*)?$/i.test(String(text || '').trim());
    }

    function normUsername(value) {
      return String(value || '').trim().toLowerCase();
    }

    function validUsername(value) {
      return /^[a-z0-9_]{3,20}$/.test(value);
    }

    function chatIdFor(a, b) {
      return [a, b].sort().join('__');
    }

    function fmtTime(ts) {
      if (!ts) return '';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return new Intl.DateTimeFormat('ru-RU', {
        day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
      }).format(d);
    }

    function updateActionButtons() {
      const visible = Boolean(state.currentChatId);
      els.deleteSelectedBtn.classList.toggle('hidden', !visible || !state.selectedMessageIds.size);
      els.clearChatBtn.classList.toggle('hidden', !visible);
    }

    function selectedCountText() {
      const n = state.selectedMessageIds.size;
      return n ? `Выбрано: ${n}` : '';
    }

    function renderLocalCurrentChat() {
      if (!state.currentChatId) return;
      renderMessages(localGetMessages(state.currentChatId));
    }

    function renderLocalChats() {
      if (!state.user) return;
      renderChatList(localGetChatsFor(state.user.uid));
    }

    function setStatus(message, isError = false) {
      els.composerStatus.textContent = message;
      els.composerStatus.classList.toggle('hidden', !message);
      els.composerStatus.classList.toggle('error', isError);
    }

    function showOnlyAuth() {
      els.authCard.classList.remove('hidden');
      els.profileCard.classList.add('hidden');
      els.newChatCard.classList.add('hidden');
      els.chatListCard.classList.add('hidden');
      els.logoutBtn.classList.add('hidden');
      els.composer.classList.add('hidden');
      els.chatTitle.textContent = 'Чат не выбран';
      els.chatSubtitle.textContent = 'Сначала войди в аккаунт';
      els.chatState.textContent = '';
      els.messages.innerHTML = '<div class="status">Сначала войди в аккаунт, потом задай username.</div>';
      updateActionButtons();
    }

    async function ensureUserDoc(user) {
      const ref = doc(db, 'users', user.uid);
      const snap = await getDoc(ref);
      if (!snap.exists()) {
        await setDoc(ref, {
          uid: user.uid,
          email: user.email || '',
          displayName: user.displayName || '',
          username: '',
          createdAt: serverTimestamp()
        });
      }
      return await getDoc(ref);
    }

    function setLoggedInShell(user, profile) {
      els.authCard.classList.add('hidden');
      els.profileCard.classList.remove('hidden');
      els.newChatCard.classList.remove('hidden');
      els.chatListCard.classList.remove('hidden');
      els.logoutBtn.classList.remove('hidden');
      els.headerMe.textContent = profile?.username ? `@${profile.username}` : (user.email || user.displayName || user.uid);
      els.profileInfo.textContent = `UID: ${user.uid}`;
      els.composer.classList.toggle('hidden', !state.currentChatId);
    }

    async function claimUsername() {
      const raw = normUsername(els.username.value);
      if (!validUsername(raw)) {
        setStatus('Username должен быть 3–20 символов: a-z, 0-9 и _', true);
        return;
      }
      if (!state.user) return;

      const usernameRef = doc(db, 'usernames', raw);
      const userRef = doc(db, 'users', state.user.uid);

      try {
        if (state.useLocal) throw new Error('local-mode');
        await runTransaction(db, async (tx) => {
          const [nameSnap, userSnap] = await Promise.all([tx.get(usernameRef), tx.get(userRef)]);
          if (nameSnap.exists()) {
            throw new Error('Такой username уже занят');
          }
          if (!userSnap.exists()) {
            tx.set(userRef, {
              uid: state.user.uid,
              email: state.user.email || '',
              displayName: state.user.displayName || '',
              username: raw,
              createdAt: serverTimestamp()
            });
          } else {
            tx.update(userRef, { username: raw });
          }
          tx.set(usernameRef, {
            uid: state.user.uid,
            username: raw,
            createdAt: serverTimestamp()
          });
        });

        await updateProfile(state.user, { displayName: raw });
        state.profile = { ...(state.profile || {}), username: raw };
        els.headerMe.textContent = `@${raw}`;
        setStatus('Никнейм занят. Теперь можно открывать чаты.');
      } catch (err) {
        if (!isPermissionError(err) && String(err?.message || '') !== 'local-mode') {
          setStatus(err.message || 'Не удалось занять username', true);
          return;
        }
        state.useLocal = true;
        const stored = localClaimUsername(state.user.uid, state.user.email || '', state.user.displayName || '', raw);
        state.profile = { ...(state.profile || {}), ...stored };
        try { await updateProfile(state.user, { displayName: raw }); } catch {}
        els.headerMe.textContent = `@${raw}`;
        setStatus('Никнейм занят в локальном режиме. Теперь можно открывать чаты.');
        renderLocalChats();
      }
    }

    async function openChatByUsername() {
      const targetUsername = normUsername(els.findUser.value);
      if (!state.user || !state.profile?.username) {
        setStatus('Сначала войди и займи свой username.', true);
        return;
      }
      if (!targetUsername) {
        setStatus('Введите username собеседника.', true);
        return;
      }
      if (targetUsername === state.profile.username) {
        setStatus('Сам с собой тоже можно, но смысла мало.', true);
        return;
      }

      try {
        if (state.useLocal) throw new Error('local-mode');
        const targetSnap = await getDoc(doc(db, 'usernames', targetUsername));
        if (!targetSnap.exists()) {
          setStatus('Пользователь с таким username не найден.', true);
          return;
        }

        const targetUid = targetSnap.data().uid;
        const targetUserSnap = await getDoc(doc(db, 'users', targetUid));
        const targetProfile = targetUserSnap.exists() ? targetUserSnap.data() : { username: targetUsername };
        const chatId = chatIdFor(state.user.uid, targetUid);

        await setDoc(doc(db, 'chats', chatId), {
          members: [state.user.uid, targetUid],
          memberNames: {
            [state.user.uid]: state.profile.username,
            [targetUid]: targetProfile.username || targetUsername
          },
          updatedAt: serverTimestamp(),
          lastMessage: ''
        }, { merge: true });

        attachChat(chatId, targetProfile.username || targetUsername, targetUid);
        els.findUser.value = '';
      } catch (err) {
        if (!isPermissionError(err) && String(err?.message || '') !== 'local-mode') {
          setStatus(err.message || 'Не удалось открыть чат', true);
          return;
        }
        state.useLocal = true;
        const targetUid = localFindUidByUsername(targetUsername);
        if (!targetUid) {
          setStatus('Пользователь с таким username не найден.', true);
          return;
        }
        const chatId = localChatIdFor(state.user.uid, targetUid);
        localUpsertChat(chatId, state.user.uid, targetUid, state.profile.username, targetUsername);
        attachChat(chatId, targetUsername, targetUid);
        els.findUser.value = '';
        renderLocalChats();
      }
    }

    function renderMessages(items) {
      state.selectedMessageIds = new Set([...state.selectedMessageIds].filter((id) => items.some((m) => m.id === id)));
      updateActionButtons();
      if (!items.length) {
        els.messages.innerHTML = '<div class="status">Тут пока пусто. Напиши первое сообщение.</div>';
        updateActionButtons();
        return;
      }
      els.messages.innerHTML = items.map((m) => {
        const mine = state.user && m.senderId === state.user.uid;
        const sender = m.senderName || (mine ? 'Вы' : 'Пользователь');
        const time = fmtTime(m.createdAt);
        const isImg = (m.type === 'image') || isImageUrl(m.text);
        const selected = state.selectedMessageIds.has(m.id) ? 'selected' : '';
        const content = isImg ? `<div class="image-wrap"><img src="${String(m.text || '').replace(/"/g, '&quot;')}" alt="картинка" loading="lazy"></div>` : `<div class="text"></div>`;
        return `
          <div class="msg ${mine ? 'me' : ''} ${selected}" data-message-id="${m.id}">
            <div class="meta"><span>${sender}</span><span>${time}</span></div>
            ${content}
          </div>
        `;
      }).join('');

      items.forEach((m, i) => {
        const node = els.messages.children[i]?.querySelector('.text');
        if (node) node.textContent = m.text || '';
      });

      [...els.messages.querySelectorAll('.msg')].forEach((el) => {
        el.addEventListener('click', () => {
          const id = el.dataset.messageId;
          if (!id) return;
          if (state.selectedMessageIds.has(id)) state.selectedMessageIds.delete(id);
          else state.selectedMessageIds.add(id);
          renderMessages(items);
        });
      });

      els.messages.scrollTop = els.messages.scrollHeight;
      updateActionButtons();
    }

    function renderChatList(chats) {
      if (!chats.length) {
        els.chatList.innerHTML = '<div class="muted">Пока нет диалогов.</div>';
        updateActionButtons();
        return;
      }
      els.chatList.innerHTML = chats.map((c) => {
        const active = c.id === state.currentChatId ? 'active' : '';
        const title = c.peerName || 'Чат';
        const preview = c.lastMessage || 'Без сообщений';
        const time = c.updatedAt ? fmtTime(c.updatedAt) : '';
        return `
          <div class="chat-item ${active}" data-chatid="${c.id}" data-peername="${title}" data-peeruid="${c.peerUid || ''}">
            <button class="clear-chat-btn" type="button" title="Очистить чат">×</button>
            <div class="top"><div class="name">@${title}</div><div class="time">${time}</div></div>
            <div class="preview"></div>
          </div>
        `;
      }).join('');

      chats.forEach((c, idx) => {
        const node = els.chatList.children[idx]?.querySelector('.preview');
        if (node) node.textContent = c.lastMessage || 'Без сообщений';
      });

      [...els.chatList.querySelectorAll('.chat-item')].forEach((el) => {
        el.addEventListener('click', () => {
          attachChat(el.dataset.chatid, el.dataset.peername, el.dataset.peeruid);
        });
        const clearBtn = el.querySelector('.clear-chat-btn');
        if (clearBtn) {
          clearBtn.addEventListener('click', async (ev) => {
            ev.stopPropagation();
            await clearChat(el.dataset.chatid, el.dataset.peername, el.dataset.peeruid);
          });
        }
      });
      updateActionButtons();
    }

    function detachChat() {
      if (state.unsubMessages) {
        state.unsubMessages();
        state.unsubMessages = null;
      }
    }

    function attachChat(chatId, peerName, peerUid) {
      detachChat();
      state.currentChatId = chatId;
      state.currentChatPeer = { name: peerName, uid: peerUid };
      state.selectedMessageIds = new Set();
      els.chatTitle.textContent = `@${peerName}`;
      els.chatSubtitle.textContent = peerUid ? `UID: ${peerUid}` : '';
      els.chatState.textContent = `Чат: ${chatId}`;
      els.composer.classList.remove('hidden');
      setStatus('');
      updateActionButtons();

      if (state.useLocal) {
        renderLocalCurrentChat();
        updateChatListSelection();
        return;
      }

      const q = query(
        collection(db, 'chats', chatId, 'messages'),
        orderBy('createdAt', 'asc'),
        limit(200)
      );

      state.unsubMessages = onSnapshot(q, (snap) => {
        const items = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        renderMessages(items);
      }, (err) => {
        els.messages.innerHTML = `<div class="status error">${err.message}</div>`;
      });

      updateChatListSelection();
    }

    function updateChatListSelection() {
      [...els.chatList.querySelectorAll('.chat-item')].forEach((el) => {
        el.classList.toggle('active', el.dataset.chatid === state.currentChatId);
      });
    }

    async function sendMessage() {
      const text = els.messageText.value.trim();
      if (!text) return;
      if (!state.user || !state.profile?.username || !state.currentChatId) {
        setStatus('Сначала открой чат и займи username.', true);
        return;
      }

      const chatRef = doc(db, 'chats', state.currentChatId);
      const msgRef = collection(db, 'chats', state.currentChatId, 'messages');

      try {
        if (state.useLocal) throw new Error('local-mode');
        await addDoc(msgRef, {
          senderId: state.user.uid,
          senderName: state.profile.username,
          text,
          type: 'text',
          createdAt: serverTimestamp()
        });

        await updateDoc(chatRef, {
          lastMessage: text.slice(0, 140),
          updatedAt: serverTimestamp()
        });

        els.messageText.value = '';
        setStatus('');
      } catch (err) {
        if (!isPermissionError(err) && String(err?.message || '') !== 'local-mode') {
          setStatus(err.message || 'Не удалось отправить сообщение', true);
          return;
        }
        state.useLocal = true;
        localAddMessage(state.currentChatId, {
          senderId: state.user.uid,
          senderName: state.profile.username,
          text,
          type: 'text'
        });
        els.messageText.value = '';
        setStatus('');
        renderLocalChats();
        renderLocalCurrentChat();
      }
    }

    async function sendImageMessage() {
      const url = prompt('Вставь ссылку на картинку (https://...)');
      if (!url) return;
      const clean = String(url).trim();
      if (!/^https?:\/\//i.test(clean)) {
        setStatus('Нужна ссылка, начинающаяся с http:// или https://', true);
        return;
      }
      if (!state.user || !state.profile?.username || !state.currentChatId) {
        setStatus('Сначала открой чат и займи username.', true);
        return;
      }
      const chatRef = doc(db, 'chats', state.currentChatId);
      const msgRef = collection(db, 'chats', state.currentChatId, 'messages');
      try {
        if (state.useLocal) throw new Error('local-mode');
        await addDoc(msgRef, {
          senderId: state.user.uid,
          senderName: state.profile.username,
          text: clean,
          type: 'image',
          createdAt: serverTimestamp()
        });
        await updateDoc(chatRef, {
          lastMessage: '[Картинка]',
          updatedAt: serverTimestamp()
        });
      } catch (err) {
        if (!isPermissionError(err) && String(err?.message || '') !== 'local-mode') {
          setStatus(err.message || 'Не удалось отправить картинку', true);
          return;
        }
        state.useLocal = true;
        localAddMessage(state.currentChatId, {
          senderId: state.user.uid,
          senderName: state.profile.username,
          text: clean,
          type: 'image'
        });
      }
      setStatus('');
      renderLocalChats();
      renderLocalCurrentChat();
    }

    async function deleteMessageById(messageId) {
      if (!state.currentChatId) return;
      if (state.useLocal) {
        localDeleteMessages(state.currentChatId, [messageId]);
        state.selectedMessageIds.delete(messageId);
        renderLocalChats();
        renderLocalCurrentChat();
        return;
      }
      try {
        await deleteDoc(doc(db, 'chats', state.currentChatId, 'messages', messageId));
      } catch (err) {
        if (isPermissionError(err)) {
          state.useLocal = true;
          localDeleteMessages(state.currentChatId, [messageId]);
          renderLocalChats();
          renderLocalCurrentChat();
        } else {
          setStatus(err.message || 'Не удалось удалить сообщение', true);
        }
      }
    }

    async function deleteSelectedMessages() {
      if (!state.currentChatId || !state.selectedMessageIds.size) return;
      const ids = [...state.selectedMessageIds];
      state.selectedMessageIds.clear();
      if (state.useLocal) {
        localDeleteMessages(state.currentChatId, ids);
        renderLocalChats();
        renderLocalCurrentChat();
        return;
      }
      try {
        await Promise.all(ids.map((id) => deleteDoc(doc(db, 'chats', state.currentChatId, 'messages', id))));
      } catch (err) {
        if (isPermissionError(err)) {
          state.useLocal = true;
          localDeleteMessages(state.currentChatId, ids);
          renderLocalChats();
          renderLocalCurrentChat();
        } else {
          setStatus(err.message || 'Не удалось удалить выбранные сообщения', true);
        }
      }
      updateActionButtons();
    }

    async function clearChat(chatId = state.currentChatId, peerName = state.currentChatPeer?.name, peerUid = state.currentChatPeer?.uid) {
      if (!chatId) return;
      const ok = confirm(`Очистить чат @${peerName || 'чат'}?`);
      if (!ok) return;
      state.selectedMessageIds.clear();
      if (state.useLocal) {
        localClearChat(chatId);
        if (state.currentChatId === chatId) renderLocalCurrentChat();
        renderLocalChats();
        return;
      }
      try {
        const snap = await getDocs(collection(db, 'chats', chatId, 'messages'));
        await Promise.all(snap.docs.map((d) => deleteDoc(d.ref)));
        await updateDoc(doc(db, 'chats', chatId), { lastMessage: '', updatedAt: serverTimestamp() });
      } catch (err) {
        if (isPermissionError(err)) {
          state.useLocal = true;
          localClearChat(chatId);
          if (state.currentChatId === chatId) renderLocalCurrentChat();
          renderLocalChats();
        } else {
          setStatus(err.message || 'Не удалось очистить чат', true);
        }
      }
      updateActionButtons();
    }

    async function refreshChats() {
      if (!state.user) return;
      if (state.unsubChats) {
        state.unsubChats();
        state.unsubChats = null;
      }

      if (state.useLocal) {
        renderLocalChats();
        updateChatListSelection();
        return;
      }

      const q = query(
        collection(db, 'chats'),
        where('members', 'array-contains', state.user.uid)
      );

      try {
        state.unsubChats = onSnapshot(q, async (snap) => {
          const chats = await Promise.all(snap.docs.map(async (d) => {
            const data = d.data();
            const peerUid = (data.members || []).find((x) => x !== state.user.uid);
            let peerName = peerUid;
            if (data.memberNames && peerUid && data.memberNames[peerUid]) {
              peerName = data.memberNames[peerUid];
            } else if (peerUid) {
              const userSnap = await getDoc(doc(db, 'users', peerUid));
              if (userSnap.exists() && userSnap.data().username) peerName = userSnap.data().username;
            }
            return {
              id: d.id,
              peerUid,
              peerName,
              lastMessage: data.lastMessage || '',
              updatedAt: data.updatedAt || null
            };
          }));
          renderChatList(chats);
          updateChatListSelection();
        }, (err) => {
          if (isPermissionError(err)) {
            state.useLocal = true;
            renderLocalChats();
            updateChatListSelection();
            return;
          }
          els.chatList.innerHTML = `<div class="status error">${err.message}</div>`;
        });
      } catch (err) {
        if (isPermissionError(err)) {
          state.useLocal = true;
          renderLocalChats();
          updateChatListSelection();
        } else {
          els.chatList.innerHTML = `<div class="status error">${err.message}</div>`;
        }
      }
    }

    async function bootProfile(user) {
      try {
        const snap = await ensureUserDoc(user);
        const data = snap.data() || {};
        state.profile = data;
        setLoggedInShell(user, data);
        if (!data.username) {
          els.profileInfo.textContent = `UID: ${user.uid}. Сейчас username не занят.`;
        } else {
          els.profileInfo.textContent = `Твой username: @${data.username}`;
          els.username.value = data.username;
        }
      } catch (err) {
        if (!isPermissionError(err)) throw err;
        state.useLocal = true;
        const data = localEnsureUser(user);
        state.profile = data;
        setLoggedInShell(user, data);
        if (!data.username) {
          els.profileInfo.textContent = `UID: ${user.uid}. Сейчас username не занят.`;
        } else {
          els.profileInfo.textContent = `Твой username: @${data.username}`;
          els.username.value = data.username;
        }
      }
      await refreshChats();
    }

    async function signUp() {

      try {
        const email = els.email.value.trim();
        const password = els.password.value;
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await ensureUserDoc(cred.user);
      } catch (err) {
        alert(err.message);
      }
    }

    async function signIn() {
      try {
        const email = els.email.value.trim();
        const password = els.password.value;
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        alert(err.message);
      }
    }

    async function signInGoogle() {
      try {
        await signInWithPopup(auth, googleProvider);
      } catch (err) {
        alert(err.message);
      }
    }

    async function doLogout() {
      await signOut(auth);
    }

    els.claimUsernameBtn.addEventListener('click', claimUsername);
    els.openChatBtn.addEventListener('click', openChatByUsername);
    els.sendBtn.addEventListener('click', sendMessage);
    els.imageBtn.addEventListener('click', sendImageMessage);
    els.deleteSelectedBtn.addEventListener('click', deleteSelectedMessages);
    els.clearChatBtn.addEventListener('click', () => clearChat());
    els.signUpBtn.addEventListener('click', signUp);
    els.signInBtn.addEventListener('click', signIn);
    els.googleBtn.addEventListener('click', signInGoogle);
    els.logoutBtn.addEventListener('click', doLogout);
    els.refreshBtn.addEventListener('click', refreshChats);
    els.messageText.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    onAuthStateChanged(auth, async (user) => {
      detachChat();
      if (state.unsubChats) {
        state.unsubChats();
        state.unsubChats = null;
      }
      state.user = user || null;
      state.profile = null;
      state.currentChatId = null;
      state.currentChatPeer = null;
      state.selectedMessageIds = new Set();
      els.chatTitle.textContent = 'Чат не выбран';
      els.chatSubtitle.textContent = 'Выбери собеседника по username';
      els.chatState.textContent = '';
      els.messages.innerHTML = '<div class="status">Сначала войди в аккаунт, потом задай username.</div>';
      els.composer.classList.add('hidden');
      updateActionButtons();

      if (!user) {
        showOnlyAuth();
        return;
      }

      await bootProfile(user);
    });

    showOnlyAuth();
  </script>
</body>
</html>
